[package]
name = "findcraft"
version = "0.1.0"
edition = "2024"
description = "Instant file search for Windows, Linux and macOS: an Everything-style desktop app, with NTFS MFT indexing on Windows"
keywords = ["file-search", "desktop-app", "everything", "ntfs", "egui"]
categories = ["filesystem", "gui"]
license = "GPL-3.0-or-later"

[[bin]]
name = "FindCraft"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
# egui 0.37 ships its emoji/icon fonts (🗀 🗋 ⚡ ⏶ ✔ …) only with this feature; without it they render as boxes.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "webp"] }
memchr = "2.8"
raw-window-handle = "0.6"
regex = "1.11"

# The Win32 calls are made on Windows only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Local time on Linux and macOS: the C library's time zone (`localtime_r`, `mktime`).
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

# Checked in CI with `cargo clippy --all-targets -- -D warnings`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every `unsafe` block states why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Indexing and searching millions of entries is unbearably slow without optimizations.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
